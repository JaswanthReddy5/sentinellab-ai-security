policy:
  name: prevent_customer_data_leak
  version: "1.0"
  description: Baseline policy blocking PII, confidential data, credentials, injection, and unsafe tool use.

rules:
  - detect: pii
    action: block
    severity: high

  - detect: confidential_data
    action: block
    severity: high

  - detect: credentials
    action: block
    severity: critical

  - detect: secrets
    action: block
    severity: critical

  - detect: prompt_injection
    action: block
    severity: high

  - detect: jailbreak
    action: block
    severity: high

  - detect: tool_abuse
    action: block
    severity: high

  - detect: data_exfiltration
    action: block
    severity: critical

  - detect: privilege_escalation
    action: block
    severity: critical

  - detect: excessive_agency
    action: review
    severity: medium

  - detect: malicious_document
    action: block
    severity: high

  - detect: policy_evasion
    action: review
    severity: medium

tools:
  send_email:
    allowed:
      - internal_domains
    blocked:
      - external_domains
